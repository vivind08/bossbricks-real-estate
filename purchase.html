<!DOCTYPE html>
<html>
<head>
    <title>Purchase Property</title>
</head>
<body>

<h2>Confirm Your Property</h2>

<p id="propName"></p>
<p id="propPrice"></p>
<p id="propCity"></p>

<h3>Enter Your Details</h3>

<input type="text" placeholder="Your Name"><br><br>
<input type="email" placeholder="Your Email"><br><br>
<input type="tel" placeholder="Your Phone"><br><br>

<button onclick="confirmPurchase()">Submit</button>

<script>

document.getElementById("propName").innerText =
    "Property: " + localStorage.getItem("selectedPropertyName");

document.getElementById("propPrice").innerText =
    "Price: " + localStorage.getItem("selectedPropertyPrice");

document.getElementById("propCity").innerText =
    "City: " + localStorage.getItem("selectedPropertyCity");

function confirmPurchase(){
    alert("Your request has been submitted! Our team will contact you.");
    window.location.href = "index.html";
}

</script>

</body>
</html>
