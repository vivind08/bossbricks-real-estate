<!DOCTYPE html>
<html lang="en">
<head>
  
  <link rel="manifest" href="/bossbricks-real-estate/manifest.json">
<meta name="theme-color" content="#1e3c72">

    <meta charset="UTF-8">
    <title>Land Properties | Bossbricks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">Bossbricks</div>
    <nav>
        <a href="index.html">Home</a>
    </nav>
</header>

<section class="properties">
    <div class="container">
        <a href="index.html" class="back-btn">← Back to Home</a>

        <h2>Premium Land Listings</h2>

        <div class="property-grid">

            <div class="property-card luxury-land">
                <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef" alt="Indian Land">

                <div class="property-info">
                    <h3>Luxury Residential Plot</h3>
                    <p class="location">📍 Alibaug, Maharashtra</p>
                    <p class="area">Area: 4,000 Sqft</p>
                    <p class="price">₹ 1,20,00,000</p>
                    <button class="luxury-btn">View Details</button>
                  <button onclick="buyProperty('Luxury Residential Plot Alibaug')">
  Buy Now
</button>
                </div>
            </div>

            <div class="property-card luxury-land">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" alt="Indian Plot">

                <div class="property-info">
                    <h3>Farm Land Investment Plot</h3>
                    <p class="location">📍 Coorg, Karnataka</p>
                    <p class="area">Area: 10,000 Sqft</p>
                    <p class="price">₹ 85,00,000</p>
                    <button class="luxury-btn">View Details</button>
                  <button onclick="buyProperty('Farm Land Investment Plot Coorg')">
  Buy Now
</button>
                </div>
            </div>

        </div>
    </div>
</section>
  <script>
function buyProperty(name, price, city){

    localStorage.setItem("selectedPropertyName", name);
    localStorage.setItem("selectedPropertyPrice", price);
    localStorage.setItem("selectedPropertyCity", city);

    window.location.href = "purchase.html";
}
</script>

</body>
</html>
