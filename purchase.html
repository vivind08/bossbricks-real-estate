<!DOCTYPE html>
<html>
<head>
  <title>Purchase Property</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      padding: 20px;
    }

    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #1e3c72;
      color: white;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Purchase Inquiry</h2>

  <p><strong>Property:</strong> <span id="propertyName"></span></p>

  <input type="text" id="name" placeholder="Your Name">
  <input type="email" id="email" placeholder="Your Email">
  <textarea id="message" placeholder="Message"></textarea>

  <button onclick="sendWhatsApp()">Contact on WhatsApp</button>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const property = params.get("property");

  document.getElementById("propertyName").innerText = property;

  function sendWhatsApp() {
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;

    const message = `Hello, I am interested in ${property}.
Name: ${name}
Email: ${email}`;

    const phoneNumber = "+918766669225"; // Replace with YOUR number

    window.open(`https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`, "_blank");
  }
</script>

</body>
</html>
